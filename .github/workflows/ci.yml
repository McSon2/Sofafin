name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une contribution extérieure ne doit jamais pouvoir écrire dans le dépôt : la
# vérification n'a besoin que de lire le code qu'elle compile.
permissions:
  contents: read

concurrency:
  # Une nouvelle poussée annule la vérification en cours sur la même branche :
  # seul le dernier état compte, et les exécuteurs macOS sont une ressource rare.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests de JellyfinKit
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # L'exécuteur `macos-26` fournit déjà Xcode 26 : forcer un chemin précis
      # casse la vérification dès qu'Apple change de numéro de version.
      - name: Version de Xcode
        run: xcodebuild -version

      - name: Lancer les tests
        working-directory: Packages/JellyfinKit
        run: swift test

  build:
    name: Compiler l'application tvOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Version de Xcode
        run: xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet
        # Aucune signature n'est nécessaire pour compiler vers le simulateur :
        # `Signing.local.xcconfig` n'existe pas ici, et l'inclusion est optionnelle.
        run: xcodegen generate

      - name: Compiler
        # `clean build` systématique : le build incrémental de ce projet annonce
        # « BUILD SUCCEEDED » sans recompiler, ce qui validerait un état périmé.
        #
        # `CODE_SIGNING_ALLOWED=NO` n'est acceptable **que sur cette machine** :
        # aucun certificat n'y est installé, et cette étape ne vérifie que la
        # compilation. Ne jamais reprendre ce réglage pour un build local — il
        # supprime les droits, donc le groupe d'applications, donc le Top Shelf,
        # et le symptôme n'apparaît qu'à l'exécution.
        run: |
          xcodebuild -project Sofafin.xcodeproj \
            -scheme Sofafin-tvOS \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            clean build

  # Ce que la compilation ne dit pas : une chaîne visible oubliée en français,
  # ou une donnée personnelle réintroduite dans un fichier suivi.
  garde-fous:
    name: Garde-fous du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aucune donnée personnelle versionnée
        run: |
          # `192.168.1.10` est l'adresse d'exemple de la documentation et de
          # l'espace réservé du champ de connexion : c'est toute autre adresse
          # privée qui trahit une machine réelle. De même, un identifiant
          # d'équipe fait exactement dix caractères — les valeurs de
          # remplacement comme VOTREEQUIPE sont plus longues.
          if git grep -nIE '\b(192\.168|10\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]+\.[0-9]+' \
               -- . ':!*.md' | grep -v '192\.168\.1\.10\b'; then
            echo "::error::Une adresse privée réelle a été versionnée."
            exit 1
          fi
          if git grep -nIE 'DEVELOPMENT_TEAM *= *[A-Z0-9]{10}\b' -- . ':!*.md'; then
            echo "::error::Un identifiant d'équipe a été versionné."
            exit 1
          fi
          # Le compte de démonstration remis à la revue d'Apple n'existe que
          # dans App Store Connect. Les notes de publication sont le seul
          # endroit où la tentation de le recopier se présente — et ce dépôt
          # est public.
          if git grep -nIE '(demo[-_]?account[-_]?(password|name)|contact-phone)' -- . ':!.github/workflows/*'; then
            echo "::error::Des identifiants de revue semblent versionnés."
            exit 1
          fi
          if git grep -nIE '\+[0-9]{10,14}\b' -- . ':!.github/workflows/*'; then
            echo "::error::Un numéro de téléphone a été versionné."
            exit 1
          fi
          echo "Aucune donnée personnelle dans les fichiers suivis."

      - name: Aucune chaîne visible non traduite
        run: |
          python3 - <<'SCRIPT'
          import json, pathlib, re, sys
          keys = set()
          for c in ["Apps/tvOS/Resources/Localizable.xcstrings",
                    "Packages/JellyfinKit/Sources/JellyfinKit/Resources/Localizable.xcstrings"]:
              keys |= set(json.loads(pathlib.Path(c).read_text())["strings"])
          # Seules les sources livrées sont concernées : les noms de tests ne
          # s'affichent nulle part, et les noms de langues restent dans la leur.
          roots = [pathlib.Path("Apps"), pathlib.Path("Packages/JellyfinKit/Sources")]
          skip_file = re.compile(r"/Tests/|Localization\.swift$")
          wrapper = re.compile(r"(\bL\(|Text\(|Label\(|Button\(|TextField\(|SecureField\("
                               r"|localized:|title:|titled:|message:|prompt:|separator:"
                               r"|accessibility(Label|Hint|Value)\()\s*$")
          # Un accent trahit le français, mais « Films » ou « Rechercher » n'en
          # ont pas : on y ajoute les mots outils, qui n'apparaissent pas dans
          # une clé d'API ni dans un identifiant.
          french = re.compile(
              r"[éèêëàâùûôîïçÉÈÀÇ]|\b(le|la|les|un|une|des|du|de|et|ou|pour|sur|dans"
              r"|avec|sans|par|au|aux|ce|cette|ces|qui|que|pas|plus|tout|tous|aucun"
              r"|aucune|Voir|Lecture|Reprendre|Serveur|Adresse|Utilisateur|Titre|Note"
              r"|Films|Rechercher|Version|Langue|Fermer|Quitter|Annuler)\b", re.I)
          # Ni les journaux ni les messages d'arrêt ne s'adressent à l'utilisateur.
          ignore_ctx = re.compile(r"jellyfinLog\.|privacy:\s*\.|preconditionFailure|origin:")
          # Ce que la détection ne peut pas distinguer seule, et qui n'est pas
          # affiché : fragments d'interpolation imbriquée dont la clé complète
          # est traduite, valeurs de repli des journaux, en-têtes HTTP.
          allowed = {
              ", rating)) sur 10", ", community)) sur 10",
              "sans description", "sans commentaire", "aucune",
          }
          bad = []
          for root in roots:
              for f in root.rglob("*.swift"):
                  if skip_file.search(str(f)): continue
                  lines = f.read_text().splitlines()
                  for i, line in enumerate(lines, 1):
                      st = line.strip()
                      if st.startswith(("//", "///", "*")): continue
                      # `case version = "Version"` nomme une clé JSON, pas un
                      # texte d'écran.
                      if re.match(r'case\s+\w+\s*=\s*"', st): continue
                      if ignore_ctx.search("\n".join(lines[max(0, i-4):i+1])): continue
                      for m in re.finditer(r'"((?:[^"\\]|\\.)*)"', line):
                          t = m.group(1)
                          if len(t) < 3 or not french.search(t): continue
                          if t in keys or t in allowed: continue
                          if "identity.version" in t or wrapper.search(line[:m.start()]): continue
                          bad.append(f"{f}:{i}  {t[:60]!r}")
          if bad:
              print("::error::Chaînes visibles non traduites :")
              for b in bad: print("  ", b)
              sys.exit(1)
          print("Toutes les chaînes visibles sont traduites.")
          SCRIPT
