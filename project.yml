name: Sofafin
options:
  bundleIdPrefix: com.maximesaltet
  deploymentTarget:
    tvOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Le français est la langue d'origine : les clés du catalogue *sont* les
  # phrases françaises, ce qui garde le code lisible sans table de symboles.
  developmentLanguage: fr

fileGroups:
  - README.md
  - README.fr.md
  - CONTRIBUTING.md
  - docs

packages:
  JellyfinKit:
    path: Packages/JellyfinKit

# L'identifiant d'équipe n'est pas versionné : il se déclare dans
# `Signing.local.xcconfig`, que ce fichier inclut s'il existe.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Sofafin-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Apps/tvOS/Sources
      - path: Apps/tvOS/Resources
        buildPhase: resources
    dependencies:
      - package: JellyfinKit
        product: JellyfinKit
      - target: SofafinTopShelf
        embed: true
    info:
      path: Apps/tvOS/Info.plist
      properties:
        CFBundleDisplayName: Sofafin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        # Sofafin ne chiffre rien lui-même : il parle HTTP ou HTTPS au serveur
        # que l'utilisateur désigne. Sans cette clé, chaque envoi de build
        # attend une réponse manuelle au questionnaire de conformité, et la
        # version reste bloquée en « en attente » sans le dire.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: >-
          Sofafin se connecte à votre serveur Jellyfin sur le réseau local
          pour lire votre médiathèque.
        NSBonjourServices:
          - _jellyfin._tcp
        # Reçoit les actions de l'étagère du haut : sofafin://play/<id>
        CFBundleURLTypes:
          - CFBundleURLName: com.maximesaltet.sofafin
            CFBundleURLSchemes:
              - sofafin
    entitlements:
      path: Apps/tvOS/Sofafin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maximesaltet.sofafin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maximesaltet.sofafin
        TVOS_DEPLOYMENT_TARGET: "26.0"
        # 3 = Apple TV. Sans cette déclaration, Xcode retombe sur la famille
        # d'iOS et l'App Store refuse le binaire en lui appliquant les règles
        # d'une application iPhone — icône, capacités, profil.
        TARGETED_DEVICE_FAMILY: "3"
        # Catalogue produit par Tools/make_icons.py
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  # Alimente l'étagère du haut de l'écran d'accueil tvOS. Processus séparé :
  # il lit la session dans le groupe d'applications partagé.
  SofafinTopShelf:
    # `app-extension`, et surtout **pas** `tv-app-extension` : ce dernier est le
    # type hérité des extensions TVML et du `TVTopShelfProvider` déprécié. Avec lui,
    # PlugInKit n'enregistre pas le bundle — le système lance bien le processus puis
    # le tue aussitôt (« must have pid! Extension request will fail »), quel que soit
    # le code qu'il contient. C'est le type qu'utilise l'exemple officiel d'Apple.
    type: app-extension
    platform: tvOS
    sources:
      - path: Apps/TopShelf/Sources
    dependencies:
      - package: JellyfinKit
        product: JellyfinKit
    info:
      path: Apps/TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Sofafin Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        # Xcode la pose sur l'application mais pas sur ses extensions, et
        # l'App Store refuse tout binaire 64 bits qui ne la déclare pas.
        UIRequiredDeviceCapabilities:
          - arm64
    entitlements:
      path: Apps/TopShelf/SofafinTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maximesaltet.sofafin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maximesaltet.sofafin.topshelf
        TVOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "3"

schemes:
  Sofafin-tvOS:
    build:
      targets:
        Sofafin-tvOS: all
    run:
      config: Debug
      # L'écran de connexion peut être pré-rempli au lancement depuis Xcode, ce
      # qui évite de saisir une adresse à la télécommande à chaque test. Aucune
      # adresse n'est versionnée : décommentez la ligne ci-dessous avec la vôtre,
      # et veillez à ne pas la valider dans un commit.
      #
      # commandLineArguments:
      #   "-serverAddress 192.168.1.10:8096": true
    archive:
      config: Release
